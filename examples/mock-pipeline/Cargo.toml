[package]
name = "mock-pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mock-pipeline"
path = "src/main.rs"

[dependencies]
confidential-ml-pipeline = { path = "../..", features = ["mock"] }
confidential-ml-transport = { git = "https://github.com/cyntrisec/confidential-ml-transport", rev = "1cfb4b16e7bc9d1f403c4a67dd9a28559a5b5b9b", features = ["mock"] }
async-trait = "0.1"
bytes = "1.5"
tokio = { version = "1.38", features = ["full"] }
