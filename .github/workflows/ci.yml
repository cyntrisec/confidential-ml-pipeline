name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - --no-default-features
          - --no-default-features --features mock
          - --no-default-features --features tcp
          - --no-default-features --features "tcp,mock"
          - --no-default-features --features sev-snp
          - --no-default-features --features tdx
          - --no-default-features --features azure-sev-snp
          - --no-default-features --features "tcp,sev-snp"
          - --no-default-features --features "tcp,tdx"
          - --no-default-features --features "tcp,azure-sev-snp"
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked ${{ matrix.features }}

  msrv:
    name: MSRV (core/default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check core/default-feature MSRV
        run: cargo check --lib --locked

  audit:
    name: Audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - examples/mock-pipeline
          - examples/tcp-pipeline
          - examples/gpt2-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.directory }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (mock+tcp)
        run: cargo clippy --locked --all-targets --no-default-features --features "tcp,mock" -- -D warnings
      - name: Run clippy (production)
        run: cargo clippy --locked --all-targets --no-default-features --features "tcp,sev-snp,tdx,azure-sev-snp" -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (mock+tcp)
        run: cargo doc --locked --no-deps --no-default-features --features "tcp,mock"
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build docs (production)
        run: cargo doc --locked --no-deps --no-default-features --features "tcp,sev-snp,tdx,azure-sev-snp"
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libtss2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check mock-pipeline example
        run: cargo check --locked --manifest-path examples/mock-pipeline/Cargo.toml
      - name: Check tcp-pipeline example
        run: cargo check --locked --manifest-path examples/tcp-pipeline/Cargo.toml
      - name: Check gpt2-pipeline example
        run: cargo check --locked --manifest-path examples/gpt2-pipeline/Cargo.toml

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
